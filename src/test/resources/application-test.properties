# Test profile — used by @WebMvcTest and unit tests (no real DB needed)
app.jwt.secret=test-secret-key-for-unit-tests-only-must-be-at-least-256-bits-long-padding
app.jwt.expiration-days=7
app.cors.allowed-origins=http://localhost:5173

# Disable Flyway and JPA validation so @WebMvcTest doesn't require a datasource
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
