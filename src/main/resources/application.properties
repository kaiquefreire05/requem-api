spring.application.name=requiem-api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:3001}
server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/requiem_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:requiem-default-secret-change-in-production-min-256bit}
app.jwt.expiration-days=7
app.cors.allowed-origins=${FRONTEND_URL:},http://localhost:5173,http://localhost:5174,http://localhost:3000
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173},http://localhost:5173,http://localhost:5174,http://localhost:3000
